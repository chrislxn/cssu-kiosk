<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15383e">
  <meta name="description" content="An offline CSSU digital poster. All events are demonstration content.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'">
  <title>CSSU — The Common Room · Demo</title>
  <link rel="icon" href="assets/cssu-icon.webp" type="image/webp">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="time-signal.css">
  <script src="display-shell.js" defer></script>
  <script src="time-signal-config.js" defer></script>
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
  <script src="time-signal.js" defer></script>
  <script src="update.js" defer></script>
</head>
<body>
  <main id="screen" aria-label="CSSU digital community board">
    <section class="hero" aria-label="Featured demo events" aria-roledescription="carousel">
      <div id="slides" class="slides"></div>
    </section>
    <header class="masthead">
      <div class="identity"><img class="brand-logo" src="assets/cssu-logo.webp" width="284" height="79" alt="CSSU — Computer Science Student Union"><span class="identity-location">UNIVERSITY OF TORONTO</span></div>
      <div class="clock"><time id="clock-time">--:--</time><div><time id="clock-date">Loading local time</time><span>TORONTO · <span id="clock-zone">LOCAL TIME</span></span></div></div>
    </header>
    <div class="ambient-footer"><div class="notice"><span class="notice-label">NOTICE /</span><p id="announcement">All events shown are illustrative samples.</p></div><div class="hero-bottom"><div class="slide-tracks" id="slide-tracks" aria-hidden="true"></div><span class="slide-number" id="slide-number">01 / 03</span></div></div>
    <footer class="price-ribbon" aria-label="CSSU shop demo prices in Canadian dollars"><div class="ribbon-label"><strong>CSSU SHOP</strong><span>CAD · DEMO PRICES</span></div><div class="price-window"><div class="price-track" id="price-track"></div></div></footer>
  </main>
  <noscript>This display needs JavaScript enabled. Open index.html in Chromium, Chrome or Safari with scripting enabled.</noscript>
</body>
</html>
