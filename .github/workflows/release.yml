name: Release kiosk

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '!frontend/version.txt'
      - 'scripts/package-kiosk.py'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'
      - '!frontend/version.txt'
      - 'scripts/package-kiosk.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiosk-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run scheduler and player regressions
        run: node --test frontend/tests/*.test.mjs
      - name: Validate and package runtime
        run: python3 scripts/package-kiosk.py
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-package
          path: |
            dist/kiosk.zip
            dist/kiosk.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kiosk-package
          path: dist
      - name: Choose next calendar version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/kiosk-tags"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' >> "$RUNNER_TEMP/kiosk-tags"
          python3 - <<'PY'
          import datetime, os, pathlib, re
          now = datetime.datetime.now(datetime.timezone.utc)
          prefix = f'v{now.year}.{now.month}.'
          tags = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'kiosk-tags').read_text().splitlines()
          numbers = [int(t[len(prefix):]) for t in tags if re.fullmatch(re.escape(prefix) + r'\d+', t)]
          tag = prefix + str(max(numbers, default=0) + 1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - name: Upload draft, then publish complete release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check kiosk.zip.sha256)
          {
            printf 'Automated release from source revision `%s`.\n\n' "$GITHUB_SHA"
            printf 'Includes `kiosk.zip` and its SHA-256 checksum. `index.html` is at the ZIP root; `version.txt` is generated by the device updater.\n\n'
            printf 'Passed Node regression suites, JavaScript syntax and package checks. Target-device activation and endurance are not verified by this workflow.\n\n'
            printf 'Workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/kiosk-release-notes.md"
          gh release create "$TAG" dist/kiosk.zip dist/kiosk.zip.sha256 \
            --draft --target "$GITHUB_SHA" --title "$TAG — CSSU Kiosk" \
            --notes-file "$RUNNER_TEMP/kiosk-release-notes.md"
          gh release edit "$TAG" --draft=false --latest
          printf 'Published [%s](%s/%s/releases/tag/%s)\n' "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
